<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobBoard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif; }
  body { background:#f4f6f8; color:#222; }

  .header { background:#1e2a4a; color:#fff; padding:20px 20px 0; }
  .header-inner { max-width:1080px; margin:0 auto; }
  .breadcrumb { font-size:13px; color:#9ba7c4; margin-bottom:10px; }
  .header h1 { font-size:24px; margin-bottom:6px; }
  .header .sub { font-size:13px; color:#c3cbe0; margin-bottom:18px; }

  .tab-bar { display:flex; gap:4px; overflow-x:auto; }
  .tab-btn {
    padding:12px 20px; border:none; background:transparent;
    color:#9ba7c4; font-size:15px; font-weight:700; cursor:pointer;
    border-bottom:3px solid transparent; transition:all .15s ease; white-space:nowrap;
  }
  .tab-btn:hover { color:#fff; }
  .tab-btn.active { color:#fff; border-bottom:3px solid #f97316; }

  .container { max-width:1080px; margin:0 auto; padding:24px 20px; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* 홈 - 히어로 & 검색 */
  .hero {
    background:linear-gradient(135deg,#2c58f0,#1e2a4a);
    border-radius:16px; padding:36px 28px; margin-bottom:28px; color:#fff;
  }
  .hero h2 { font-size:20px; margin-bottom:14px; }
  .search-box { display:flex; gap:8px; }
  .search-box input {
    flex:1; padding:13px 16px; border:none; border-radius:10px;
    font-size:14px; outline:none;
  }
  .search-box button {
    padding:13px 22px; border:none; border-radius:10px; background:#f97316;
    color:#fff; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .search-box button:hover { background:#ea6a0d; }
  .search-hint { font-size:12px; color:#cbd5e1; margin-top:10px; }

  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px; }
  .stat-card {
    background:#fff; border:1px solid #e8eaf0; border-radius:12px;
    padding:18px 10px; text-align:center;
  }
  .stat-num { font-size:22px; font-weight:800; color:#2c58f0; margin-bottom:4px; }
  .stat-label { font-size:12px; color:#6b7280; font-weight:600; }

  .section-title {
    font-size:16px; font-weight:800; color:#111827; margin:26px 0 12px;
    display:flex; align-items:center; gap:6px;
  }

  .filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .filter-btn {
    padding:8px 18px; border:1px solid #d8dce5; border-radius:999px;
    background:#fff; color:#4b5563; font-size:13px; font-weight:600;
    cursor:pointer; transition:all .15s ease;
  }
  .filter-btn:hover { border-color:#2c58f0; color:#2c58f0; }
  .filter-btn.active { background:#2c58f0; border-color:#2c58f0; color:#fff; }

  /* 채용공고 탭 레이아웃 (사이드바 + 콘텐츠) */
  .job-tab-layout { display:flex; gap:20px; align-items:flex-start; }
  .job-sidebar {
    width:220px; flex-shrink:0; background:#fff; border:1px solid #e8eaf0;
    border-radius:12px; padding:18px; position:sticky; top:16px;
  }
  .job-content { flex:1; min-width:0; }

  .sidebar-title { font-size:14px; font-weight:800; color:#111827; margin-bottom:12px; }
  .sidebar-actions { display:flex; gap:6px; margin-bottom:12px; }
  .sidebar-actions button {
    flex:1; padding:6px 0; border:1px solid #d8dce5; border-radius:6px;
    background:#f9fafb; color:#4b5563; font-size:11px; font-weight:700; cursor:pointer;
  }
  .sidebar-actions button:hover { border-color:#2c58f0; color:#2c58f0; }

  .location-list { display:flex; flex-direction:column; gap:2px; max-height:460px; overflow-y:auto; }

  .region-group { border-bottom:1px solid #f1f2f5; padding-bottom:4px; margin-bottom:4px; }
  .region-group:last-child { border-bottom:none; }

  .location-item {
    display:flex; align-items:center; gap:8px; padding:7px 6px; border-radius:6px;
    font-size:13px; color:#374151; cursor:pointer; transition:background .1s ease;
  }
  .location-item:hover { background:#f0f5ff; }
  .location-item input { width:15px; height:15px; accent-color:#2c58f0; cursor:pointer; flex-shrink:0; }
  .location-item .loc-count { margin-left:auto; font-size:11px; color:#9ca3af; }

  .region-item { font-weight:700; color:#111827; }
  .expand-btn {
    border:none; background:transparent; color:#9ca3af; font-size:11px;
    cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .expand-btn:hover { color:#2c58f0; }

  .sub-location-list { display:flex; flex-direction:column; gap:1px; padding-left:20px; }
  .sub-location-list.collapsed { display:none; }
  .sub-location-list .location-item { font-size:12.5px; color:#4b5563; padding:5px 6px; }

  .toolbar-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .page-info { font-size:13px; color:#6b7280; }
  .sort-select {
    padding:8px 14px; border:1px solid #d8dce5; border-radius:8px;
    background:#fff; color:#374151; font-size:13px; font-weight:600; cursor:pointer;
    outline:none;
  }
  .sort-select:hover { border-color:#2c58f0; }

  .job-list { display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
  .job-card {
    display:flex; align-items:center; gap:16px; background:#fff;
    border:1px solid #e8eaf0; border-radius:12px; padding:18px 20px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04); transition:box-shadow .15s ease, transform .15s ease;
  }
  .job-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.08); transform:translateY(-2px); }

  .job-logo {
    flex-shrink:0; width:48px; height:48px; border-radius:10px;
    background:#e8edff; color:#2c58f0; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .job-logo.news { background:#fff0e6; color:#f97316; }
  .job-logo.company { background:#e9f9f0; color:#16a34a; }

  .job-main { flex:1; min-width:0; }
  .job-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
  .job-title { font-size:16px; font-weight:700; color:#111827; }
  .category-tag {
    font-size:11px; font-weight:700; color:#2c58f0; background:#e8edff;
    padding:2px 9px; border-radius:999px;
  }
  .category-tag.news { color:#f97316; background:#fff0e6; }
  .category-tag.company { color:#16a34a; background:#e9f9f0; }
  .type-tag {
    font-size:10px; font-weight:700; color:#fff; background:#9ca3af;
    padding:2px 8px; border-radius:999px;
  }
  .type-tag.job { background:#2c58f0; }
  .type-tag.news { background:#f97316; }
  .type-tag.company { background:#16a34a; }
  .source-tag {
    font-size:10px; font-weight:700; color:#9ca3af; background:#f3f4f6;
    padding:2px 8px; border-radius:999px;
  }
  .company { font-size:13px; color:#2c58f0; font-weight:600; margin-bottom:6px; }
  .job-info { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:#6b7280; }
  .deadline { color:#e02424; font-weight:600; }
  .desc { font-size:13px; color:#6b7280; margin-top:2px; }

  .job-side { flex-shrink:0; }
  .save-btn {
    padding:9px 18px; border:none; border-radius:8px; background:#f97316;
    color:#fff; font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap; transition:all .15s ease;
  }
  .save-btn:hover { background:#ea6a0d; }
  .save-btn.saved { background:#e5e7eb; color:#4b5563; }

  .link-btn {
    display:inline-block; padding:9px 18px; border:1.5px solid #2c58f0; border-radius:8px;
    background:#fff; color:#2c58f0; font-size:13px; font-weight:700;
    text-decoration:none; white-space:nowrap; transition:all .15s ease;
  }
  .link-btn:hover { background:#2c58f0; color:#fff; }

  .badge {
    padding:9px 16px; border-radius:8px; background:#f0f5ff; color:#2c58f0;
    font-size:13px; font-weight:700; white-space:nowrap; text-align:center;
  }

  .pagination { display:flex; justify-content:center; gap:8px; }
  .page-btn {
    width:36px; height:36px; border:1px solid #d8dce5; border-radius:8px;
    background:#fff; color:#4b5563; font-size:14px; font-weight:600;
    cursor:pointer; transition:all .15s ease;
  }
  .page-btn:hover { border-color:#2c58f0; color:#2c58f0; }
  .page-btn.active { background:#2c58f0; border-color:#2c58f0; color:#fff; }

  .no-result { text-align:center; padding:60px 0; color:#9ca3af; font-size:14px; }
  .footer { text-align:center; padding:22px; font-size:12px; color:#9ca3af; }

  /* 마이페이지 - 프로필 */
  .profile-card {
    display:flex; align-items:center; gap:16px; background:#fff;
    border:1px solid #e8eaf0; border-radius:14px; padding:22px; margin-bottom:20px;
  }
  .profile-avatar {
    width:60px; height:60px; border-radius:50%; background:#2c58f0; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;
    flex-shrink:0;
  }
  .profile-name { font-size:17px; font-weight:800; margin-bottom:4px; }
  .profile-sub { font-size:13px; color:#6b7280; }

  .mypage-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:10px; }

  @media (max-width:760px) {
    .job-tab-layout { flex-direction:column; }
    .job-sidebar { width:100%; position:static; }
    .location-list { max-height:220px; }
  }

  @media (max-width:600px) {
    .job-card { flex-wrap:wrap; }
    .job-side { width:100%; }
    .save-btn, .link-btn { width:100%; text-align:center; }
    .tab-btn { padding:12px 12px; font-size:13px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); }
    .mypage-stats { grid-template-columns:repeat(1,1fr); }
    .search-box { flex-direction:column; }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="breadcrumb">JobBoard</div>
      <h1>JobBoard</h1>
      <div class="sub">채용공고 · 채용뉴스 · 기업정보를 한 곳에서 확인하세요</div>
      <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="home">홈</button>
        <button class="tab-btn" data-tab="jobs">채용공고</button>
        <button class="tab-btn" data-tab="news">채용뉴스</button>
        <button class="tab-btn" data-tab="company">기업정보</button>
        <button class="tab-btn" data-tab="mypage">마이페이지</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 홈 탭 -->
    <section class="tab-panel active" id="panel-home">
      <div class="hero">
        <h2>🔍 원하는 채용정보를 검색해보세요</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="기업명, 공고 제목, 지역, 뉴스 키워드로 검색해보세요">
          <button id="searchBtn">검색</button>
        </div>
        <div class="search-hint">채용공고 · 채용뉴스 · 기업정보를 통합해서 검색합니다</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statJobs">0</div><div class="stat-label">채용공고</div></div>
        <div class="stat-card"><div class="stat-num" id="statNews">0</div><div class="stat-label">채용뉴스</div></div>
        <div class="stat-card"><div class="stat-num" id="statCompanies">0</div><div class="stat-label">등록 기업</div></div>
        <div class="stat-card"><div class="stat-num" id="statUrgent">0</div><div class="stat-label">마감임박 공고</div></div>
      </div>

      <div id="homeDefault">
        <div class="section-title">⏰ 마감임박 채용공고</div>
        <div class="job-list" id="urgentJobList"></div>

        <div class="section-title">📰 최신 채용뉴스</div>
        <div class="job-list" id="latestNewsList"></div>

        <div class="section-title">🏢 등록 기업정보</div>
        <div class="job-list" id="topCompanyList"></div>
      </div>

      <div id="homeSearchResults" style="display:none;">
        <div class="page-info" id="searchResultInfo"></div>
        <div class="job-list" id="searchResultList"></div>
      </div>
    </section>

    <!-- 채용공고 탭 -->
    <section class="tab-panel" id="panel-jobs">
      <div class="job-tab-layout">

        <!-- 좌측 지역 필터 사이드바 -->
        <aside class="job-sidebar">
          <div class="sidebar-title">📍 지역별 필터</div>
          <div class="sidebar-actions">
            <button id="locSelectAll">전체선택</button>
            <button id="locReset">초기화</button>
          </div>
          <div class="location-list" id="locationList"></div>
        </aside>

        <!-- 우측 콘텐츠 -->
        <div class="job-content">
          <div class="filter-bar" id="jobFilterBar"></div>
          <div class="toolbar-row">
            <div class="page-info" id="jobPageInfo"></div>
            <select class="sort-select" id="jobSortSelect">
              <option value="default">기본순</option>
              <option value="deadline">마감임박순</option>
              <option value="alpha">가나다순</option>
            </select>
          </div>
          <div class="job-list" id="jobList"></div>
          <div class="pagination" id="jobPagination"></div>
        </div>

      </div>
    </section>

    <!-- 채용뉴스 탭 -->
    <section class="tab-panel" id="panel-news">
      <div class="filter-bar" id="newsFilterBar"></div>
      <div class="page-info" id="newsPageInfo"></div>
      <div class="job-list" id="newsList"></div>
      <div class="pagination" id="newsPagination"></div>
    </section>

    <!-- 기업정보 탭 -->
    <section class="tab-panel" id="panel-company">
      <div class="page-info" id="companyPageInfo"></div>
      <div class="job-list" id="companyList"></div>
      <div class="pagination" id="companyPagination"></div>
    </section>

    <!-- 마이페이지 탭 -->
    <section class="tab-panel" id="panel-mypage">
      <div class="profile-card">
        <div class="profile-avatar">JB</div>
        <div>
          <div class="profile-name">Guest 님, 환영합니다</div>
          <div class="profile-sub">관심있는 채용공고를 저장하고 마이페이지에서 모아보세요</div>
        </div>
      </div>

      <div class="mypage-stats">
        <div class="stat-card"><div class="stat-num" id="mySavedCount">0</div><div class="stat-label">저장한 공고</div></div>
      </div>

      <div class="section-title">💾 저장한 채용공고</div>
      <div class="job-list" id="savedJobList"></div>
    </section>

  </main>

  <footer class="footer">&copy; 2026 JobBoard. All rights reserved.</footer>

<script>

}

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const homeDefault = document.getElementById("homeDefault");
const homeSearchResults = document.getElementById("homeSearchResults");
const searchResultInfo = document.getElementById("searchResultInfo");
const searchResultList = document.getElementById("searchResultList");

function withTypeTag(cardHTML, label, type) {
  return cardHTML.replace('<div class="job-header">', `<div class="job-header"><span class="type-tag ${type}">${label}</span>`);
}

function runSearch() {
  const kw = searchInput.value.trim().toLowerCase();
  if (!kw) {
    homeDefault.style.display = "block";
    homeSearchResults.style.display = "none";
    return;
  }
  const jobResults = jobs.filter(j =>
    j.title.toLowerCase().includes(kw) || j.company.toLowerCase().includes(kw) ||
    j.location.toLowerCase().includes(kw) || j.category.toLowerCase().includes(kw));
  const newsResults = news.filter(n =>
    n.title.toLowerCase().includes(kw) || n.press.toLowerCase().includes(kw) || n.category.toLowerCase().includes(kw));
  const companyResults = companies.filter(c =>
    c.name.toLowerCase().includes(kw) || c.industry.toLowerCase().includes(kw) || c.desc.toLowerCase().includes(kw));

  const total = jobResults.length + newsResults.length + companyResults.length;
  homeDefault.style.display = "none";
  homeSearchResults.style.display = "block";
  searchResultInfo.textContent = `"${searchInput.value}" 검색 결과 · 총 ${total}건 (채용공고 ${jobResults.length} · 채용뉴스 ${newsResults.length} · 기업정보 ${companyResults.length})`;

  if (total === 0) {
    searchResultList.innerHTML = `<div class="no-result">검색 결과가 없습니다.</div>`;
    return;
  }

  searchResultList.innerHTML =
    jobResults.map(j => withTypeTag(jobCardHTML(j), "채용공고", "job")).join("") +
    newsResults.map(n => withTypeTag(newsCardHTML(n), "채용뉴스", "news")).join("") +
    companyResults.map(c => withTypeTag(companyCardHTML(c), "기업정보", "company")).join("");
}

searchBtn.addEventListener("click", runSearch);
searchInput.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

homeSearchResults.addEventListener("click", e => {
  const btn = e.target.closest(".save-btn");
  if (!btn) return;
  const key = btn.dataset.key;
  savedIds.has(key) ? savedIds.delete(key) : savedIds.add(key);
  runSearch();
});
document.getElementById("urgentJobList").addEventListener("click", e => {

  savedIds.has(key) ? savedIds.delete(key) : savedIds.add(key);
  renderHomeStats();
});

/* ---------- 채용공고 탭 ---------- */
const JOB_CATEGORIES = ["전체", ...Array.from(new Set(jobs.map(j => j.category)))];
const JOB_PER_PAGE = 13;
let jobCategory = "전체", jobPage = 1, jobSort = "default";
const selectedLocations = new Set();   // 선택된 "세부 지역" (예: "서울 강남구", "서울")
const expandedRegions = new Set();     // 펼쳐진 대분류 지역

// 지역 계층 구조 만들기: { "서울": ["서울 강남구", "서울 마포구", "서울"(전체표기 있으면 포함), ...], "경기": [...] }
const REGION_MAP = {};
jobs.forEach(j => {
  const region = j.location.split(" ")[0];
  if (!REGION_MAP[region]) REGION_MAP[region] = new Set();
  REGION_MAP[region].add(j.location);
});
const REGION_NAMES = Object.keys(REGION_MAP).sort((a, b) => a.localeCompare(b, "ko"));
REGION_NAMES.forEach(r => {
  REGION_MAP[r] = Array.from(REGION_MAP[r]).sort((a, b) => a.localeCompare(b, "ko"));
  expandedRegions.add(r); // 기본적으로 모두 펼쳐진 상태
});

const jobFilterBar = document.getElementById("jobFilterBar");
const jobPageInfo = document.getElementById("jobPageInfo");
const jobListEl = document.getElementById("jobList");
const jobPagination = document.getElementById("jobPagination");
const locationListEl = document.getElementById("locationList");
const jobSortSelect = document.getElementById("jobSortSelect");

function renderLocationSidebar() {
  locationListEl.innerHTML = REGION_NAMES.map(region => {
    const locs = REGION_MAP[region];
    const regionCount = jobs.filter(j => j.location.split(" ")[0] === region).length;
    const checkedCount = locs.filter(l => selectedLocations.has(l)).length;
    const allChecked = checkedCount === locs.length;
    const someChecked = checkedCount > 0 && !allChecked;
    const isExpanded = expandedRegions.has(region);

    const childrenHTML = locs.map(loc => {
      const count = jobs.filter(j => j.location === loc).length;
      const label = loc === region ? `${region} (전체)` : loc.slice(region.length).trim();
      const checked = selectedLocations.has(loc) ? "checked" : "";
      return `
        <label class="location-item">
          <input type="checkbox" data-location="${loc}" ${checked}>
          <span>${label}</span>
          <span class="loc-count">${count}</span>
        </label>`;
    }).join("");

    return `
      <div class="region-group">
        <label class="location-item region-item">
          <input type="checkbox" data-region="${region}" ${allChecked ? "checked" : ""} data-indeterminate="${someChecked}">
          <span>${region}</span>
          <span class="loc-count">${regionCount}</span>
          <button type="button" class="expand-btn" data-toggle-region="${region}">${isExpanded ? "▾" : "▸"}</button>
        </label>
        <div class="sub-location-list ${isExpanded ? "" : "collapsed"}" data-children-of="${region}">
          ${childrenHTML}
        </div>
      </div>`;
  }).join("");

  // 부분 선택(indeterminate) 상태는 속성으로 표현 불가하므로 JS로 직접 설정
  locationListEl.querySelectorAll('input[data-region]').forEach(cb => {
    cb.indeterminate = cb.dataset.indeterminate === "true";
  });
}

locationListEl.addEventListener("click", e => {
  const toggleBtn = e.target.closest("[data-toggle-region]");
  if (toggleBtn) {
    const region = toggleBtn.dataset.toggleRegion;
    expandedRegions.has(region) ? expandedRegions.delete(region) : expandedRegions.add(region);
    renderLocationSidebar();
  }
});

locationListEl.addEventListener("change", e => {
  const regionCb = e.target.closest('input[data-region]');
  const locCb = e.target.closest('input[data-location]');

  if (regionCb) {
    const region = regionCb.dataset.region;
    const locs = REGION_MAP[region];
    if (regionCb.checked) {
      locs.forEach(l => selectedLocations.add(l));
    } else {
      locs.forEach(l => selectedLocations.delete(l));
    }
  } else if (locCb) {
    const loc = locCb.dataset.location;
    locCb.checked ? selectedLocations.add(loc) : selectedLocations.delete(loc);
  } else {
    return;
  }

  jobPage = 1;
  renderLocationSidebar();
  renderJobs();
});

document.getElementById("locSelectAll").addEventListener("click", () => {
  REGION_NAMES.forEach(region => REGION_MAP[region].forEach(l => selectedLocations.add(l)));
  jobPage = 1;
  renderLocationSidebar();
  renderJobs();
});

document.getElementById("locReset").addEventListener("click", () => {
  selectedLocations.clear();
  jobPage = 1;
  renderLocationSidebar();
  renderJobs();
});

jobSortSelect.addEventListener("change", () => {
  jobSort = jobSortSelect.value;
  jobPage = 1;
  renderJobs();
});

function getSortedFilteredJobs() {
  let filtered = jobCategory === "전체" ? jobs.slice() : jobs.filter(j => j.category === jobCategory);
  if (selectedLocations.size > 0) {
    filtered = filtered.filter(j => selectedLocations.has(j.location));
  }
  if (jobSort === "deadline") {
    filtered.sort((a, b) => {
      const da = parsableDate(a.deadline), db = parsableDate(b.deadline);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });
  } else if (jobSort === "alpha") {
    filtered.sort((a, b) => a.company.localeCompare(b.company, "ko"));
  }
  return filtered;
}

function renderJobs() {
  jobFilterBar.innerHTML = JOB_CATEGORIES.map(cat =>
    `<button class="filter-btn ${cat === jobCategory ? "active" : ""}" data-category="${cat}">${cat}</button>`
  ).join("");

  const filtered = getSortedFilteredJobs();
  const totalPages = Math.max(1, Math.ceil(filtered.length / JOB_PER_PAGE));
  if (jobPage > totalPages) jobPage = totalPages;
  const start = (jobPage - 1) * JOB_PER_PAGE;
  const pageItems = filtered.slice(start, start + JOB_PER_PAGE);

  const locNote = selectedLocations.size > 0 ? ` · 선택 지역 ${selectedLocations.size}곳` : "";
  jobPageInfo.textContent = `${jobPage}페이지 (${pageItems.length}건) · 총 ${totalPages}페이지 · 전체 ${filtered.length}건${locNote}`;
  jobListEl.innerHTML = pageItems.length === 0
    ? `<div class="no-result">조건에 맞는 채용공고가 없습니다.</div>`
    : pageItems.map(jobCardHTML).join("");

  jobPagination.innerHTML = Array.from({length: totalPages}, (_, i) => i + 1)
    .map(n => `<button class="page-btn ${n === jobPage ? "active" : ""}" data-page="${n}">${n}</button>`).join("");
}

jobFilterBar.addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn"); if (!btn) return;
  jobCategory = btn.dataset.category; jobPage = 1; renderJobs();
});
jobListEl.addEventListener("click", e => {
  const btn = e.target.closest(".save-btn"); if (!btn) return;
  const key = btn.dataset.key;
  savedIds.has(key) ? savedIds.delete(key) : savedIds.add(key);
  renderJobs();
});
jobPagination.addEventListener("click", e => {
  const btn = e.target.closest(".page-btn"); if (!btn) return;
  jobPage = Number(btn.dataset.page); renderJobs();
});

let companyPage = 1;

const companyPageInfo = document.getElementById("companyPageInfo");

const companyPagination = document.getElementById("companyPagination");

function renderCompany() {

  const start = (companyPage - 1) * COMPANY_PER_PAGE;
  const pageItems = companies.slice(start, start + COMPANY_PER_PAGE);

  companyPageInfo.textContent = `${companyPage}페이지 (${pageItems.length}건) · 총 ${totalPages}페이지 · 전체 ${companies.length}건`;
  companyListEl.innerHTML = pageItems.map(companyCardHTML).join("");

  companyPagination.innerHTML = Array.from({length: totalPages}, (_, i) => i + 1)
    .map(n => `<button class="page-btn ${n === companyPage ? "active" : ""}" data-page="${n}">${n}</button>`).join("");
}

companyPagination.addEventListener("click", e => {
  const btn = e.target.closest(".page-btn"); if (!btn) return;
  companyPage = Number(btn.dataset.page); renderCompany();
});

/* ---------- 마이페이지 탭 ---------- */
const savedJobListEl = document.getElementById("savedJobList");
const mySavedCountEl = document.getElementById("mySavedCount");

function renderMyPage() {
  const savedJobs = jobs.filter(j => savedIds.has("job" + j.id));
  mySavedCountEl.textContent = savedJobs.length;
  savedJobListEl.innerHTML = savedJobs.length === 0
    ? `<div class="no-result">아직 저장한 채용공고가 없습니다.<br>채용공고 탭에서 '저장하기' 버튼을 눌러보세요.</div>`
    : savedJobs.map(jobCardHTML).join("");
}

savedJobListEl.addEventListener("click", e => {
  const btn = e.target.closest(".save-btn"); if (!btn) return;
  const key = btn.dataset.key;
  savedIds.has(key) ? savedIds.delete(key) : savedIds.add(key);
  renderMyPage();
});

/* ---------- 초기 렌더 ---------- */
renderHomeStats();
renderLocationSidebar();
renderJobs();
renderNews();
renderCompany();
</script>
</body>
</html>
